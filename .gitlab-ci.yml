# CI for the neurofedora spec repo.
#
# The source-completeness gate is the important one: it blocks a push whose specs
# reference a Source/Patch file that is not committed here (and not a URL or an
# allow-listed lookaside tarball). That is exactly the class of bug that let vtk
# and paraview sit "green" for weeks while their GitLab SCM builds were broken —
# the file lived only in a local ~/rpmbuild/SOURCES and an uploaded SRPM masked it.

stages:
  - validate

source-completeness:
  stage: validate
  image: registry.fedoraproject.org/fedora:latest
  before_script:
    # rpm-build -> rpmspec; forge-srpm-macros -> %forgesource expands to a URL.
    - dnf -y --setopt=install_weak_deps=False install rpm-build forge-srpm-macros redhat-rpm-config >/dev/null
  script:
    - bash ci/audit-sources.sh
  rules:
    - changes:
        - "*.spec"
        - "*.patch"
        - "ci/**/*"
        - ".gitlab-ci.yml"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Source-URL liveness. Network-dependent, so it does not block a normal push
# (a transient 404/timeout shouldn't); a scheduled pipeline is the authoritative
# run that flags persistently dead Source URLs (the libspm / ITK6-remote-module
# class of failure). Add a pipeline schedule in GitLab CI/CD settings to enable.
source-urls:
  stage: validate
  image: registry.fedoraproject.org/fedora:latest
  allow_failure: true
  before_script:
    - dnf -y --setopt=install_weak_deps=False install rpm-build forge-srpm-macros redhat-rpm-config curl >/dev/null
  script:
    - bash ci/check-source-urls.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Informational only (does not block): surface rpmlint findings on the specs.
rpmlint:
  stage: validate
  image: registry.fedoraproject.org/fedora:latest
  allow_failure: true
  before_script:
    - dnf -y --setopt=install_weak_deps=False install rpmlint rpm-build forge-srpm-macros redhat-rpm-config >/dev/null
  script:
    - rpmlint --version
    - 'ec=0; for s in *.spec; do rpmlint "$s" || ec=1; done; exit $ec'
  rules:
    - changes:
        - "*.spec"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Repo-contents gate: does each spec actually produce an installable RPM?
#
# audit-sources.sh proves the sources are committed; check-source-urls.sh proves
# the remote ones resolve; this proves something came out the far end. COPR's own
# status cannot answer that -- its red badge fires when ANY chroot fails (so
# healthy F44 packages look broken because rawhide is), and latest_succeeded_build
# is null for those same healthy packages, because a *build* only counts as
# succeeded when EVERY chroot does.
#
# 3dslicer-dcmqi is why this exists: it sat in the package list for months looking
# real, having never built once, quietly stacking up six independent defects that
# were each invisible until the previous one was fixed.
#
# Network- and repo-state-dependent, so like source-urls it is not a per-push
# blocker; the scheduled run is the authoritative one. Promote to blocking once
# ci/no-rpm-allowlist.txt is empty.
repo-contents:
  stage: validate
  image: registry.fedoraproject.org/fedora:latest
  allow_failure: true
  before_script:
    - dnf -y --setopt=install_weak_deps=False install rpm-build forge-srpm-macros redhat-rpm-config dnf-plugins-core >/dev/null
    - dnf -y copr enable mhough/neurofedora >/dev/null
    - dnf -y copr enable mhough/neurofedora-nonfree >/dev/null
  script:
    - bash ci/check-repo-contents.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
